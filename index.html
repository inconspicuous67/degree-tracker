<!doctype html>
<!--
  index.html — the ONE page of the app.
  The browser loads this file first. It contains:
    1. Settings for phones (the <meta> tags)
    2. A top bar with the page title
    3. An empty <main> area that JavaScript fills in for each tab
    4. The tab bar at the bottom
  Everything that changes from tab to tab is drawn by the files in js/views/.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Make the page fit the phone screen, including the area around the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tell the browser we support both light and dark mode -->
  <meta name="color-scheme" content="light dark">
  <!-- Lets the app open full-screen (no Safari address bar) when added to the Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Degree">
  <title>Degree Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- type="module" lets our JavaScript files import from each other -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top-bar">
    <h1 id="page-title">Home</h1>
  </header>

  <!-- Each tab's content gets drawn in here -->
  <main id="view"></main>

  <!-- Bottom tab bar. href="#classes" changes the "hash" part of the URL,
       and js/app.js notices and shows the matching tab. -->
  <nav class="tab-bar" aria-label="Main">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#classes" data-tab="classes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>Classes</span>
    </a>
    <a href="#requirements" data-tab="requirements">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>
      <span>Reqs</span>
    </a>
    <a href="#catalog" data-tab="catalog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>Catalog</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>
</body>
</html>
