<!doctype html>
<!--
  index.html — the ONE page of the app.
  It holds: phone settings (<meta> tags), an empty <main> that JavaScript
  fills in for each screen, and the tab bar at the bottom.
  Everything inside <main> is drawn by the files in js/views/.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fit the phone screen, including around the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- Open full-screen (no Safari bar) when added to the Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Degree">
  <meta name="theme-color" content="#8c1515">
  <title>Degree Tracker</title>
  <!-- App icon + "install" info for the Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Each screen gets drawn in here -->
  <main id="view"></main>

  <!-- Bottom tab bar. href="#plan" changes the end of the web address;
       js/app.js notices and shows the matching screen. -->
  <nav class="tab-bar" aria-label="Main">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#plan" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>Plan</span>
    </a>
    <a href="#requirements" data-tab="requirements">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>
      <span>Reqs</span>
    </a>
    <a href="#explore" data-tab="explore">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>Explore</span>
    </a>
  </nav>
</body>
</html>
